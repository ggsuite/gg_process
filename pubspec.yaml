name: gg_process
description: GgProcess is a wrapper around Process.run and Process.start. It allows us to mock the execution of console programs.
version: 1.2.0
repository: https://github.com/inlavigo/gg_process.git

environment:
  sdk: ">=3.13.0 <4.0.0"

dependencies:
  args: ^2.7.0
  collection: ^1.19.1
  colorize: ^3.0.0
  path: ^1.9.1
  mocktail: ^1.0.5

dev_dependencies:
  gg_capture_print: ^1.1.0
  lints: ^6.1.0
  test: ^1.31.2